name: Test the demo index

on: pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv run --frozen main.py --demo-only
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Stage the demo in a copy of the published site
        run: uv run --frozen python -m src.publish pages "${GITHUB_SHA::7}"
