name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - v0.0.2

  workflow_dispatch:

jobs:

  build-index:
    permissions:
      contents: write # Needed for GH pages updates

    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13" 
          
      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Build site
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) uv run --frozen main.py

      - name: Check out GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Publish pages
        if: github.ref == 'refs/heads/master'
        run: |
          uv run --frozen python -m src.publish pages "${GITHUB_SHA::7}"

          cd pages
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish Wheel Variant Index for ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi
